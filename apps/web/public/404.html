<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>JARVIS OS</title>
    <script type="text/javascript">
      var l = window.location;
      var path = l.pathname.replace(/^\/jarvis-os\/?/, '/');
      if (!path.startsWith('/')) path = '/' + path;
      var target = l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') + '/jarvis-os/#' + path + l.search + l.hash;
      window.location.replace(target);
    </script>
  </head>
  <body>
  </body>
</html>
